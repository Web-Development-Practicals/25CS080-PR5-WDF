<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration - CHARUSAT Student Portal</title>

    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="brand">

            <img src="charusat logo.jpg"
                 alt="CHARUSAT Logo"
                 width="180">

            <h1>CHARUSAT Student Portal</h1>

        </div>

        <!-- Navigation -->
        <nav>

            <a href="index.html">Home</a>

            <a href="login.html">Login</a>

            <a href="dashboard-student.html">Student Dashboard</a>

            <a href="dashboard-admin.html">Admin Dashboard</a>

            <a href="profile.html">Profile</a>

            <a href="courses.html">Courses</a>

            <a href="registration.html" class="active">
                Registration
            </a>

            <a href="results.html">Grades</a>

            <a href="announcements.html">Announcements</a>

            <a href="feedback.html">Feedback</a>

            <a href="logout.html">Logout</a>

        </nav>

    </header>


    <!-- Main Content -->
    <main>

        <h2>Student Registration Form</h2>

        <p class="intro">
            Please fill in all the details to register as a student.
        </p>


        <form id="registrationForm" novalidate>


            <!-- Full Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <small id="nameError" class="error"></small>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >

                <small id="emailError" class="error"></small>

            </div>


            <!-- Mobile -->
            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    required
                >

                <small id="mobileError" class="error"></small>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <small id="passwordError" class="error"></small>

                <div class="password-strength">

                    Password Strength:
                    <strong id="strengthText">
                        None
                    </strong>

                </div>

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter password"
                    required
                >

                <small
                    id="confirmPasswordError"
                    class="error">
                </small>

            </div>


            <!-- Course -->
            <div class="form-group">

                <label for="course">
                    Course
                </label>

                <select id="course" name="course" required>

                    <option value="">
                        Select Course
                    </option>

                    <option value="BBA">
                        BBA
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="B.Tech">
                        B.Tech
                    </option>

                    <option value="B.Sc">
                        B.Sc
                    </option>

                </select>

                <small id="courseError" class="error"></small>

            </div>


            <!-- Year -->
            <div class="form-group">

                <label for="year">
                    Year
                </label>

                <select id="year" name="year" required>

                    <option value="">
                        Select Year
                    </option>

                    <option value="First Year">
                        First Year
                    </option>

                    <option value="Second Year">
                        Second Year
                    </option>

                    <option value="Third Year">
                        Third Year
                    </option>

                    <option value="Fourth Year">
                        Fourth Year
                    </option>

                </select>

                <small id="yearError" class="error"></small>

            </div>


            <!-- Gender -->
            <div class="form-group">

                <label>
                    Gender
                </label>

                <div class="radio-group">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>

                </div>

                <small id="genderError" class="error"></small>

            </div>


            <!-- Terms -->
            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                    >

                    I accept the Terms and Conditions.

                </label>

                <small id="termsError" class="error"></small>

            </div>


            <!-- Submit -->
            <button type="submit" class="btn">
                Register
            </button>


            <!-- Success Message -->
            <div
                id="successMessage"
                class="success"
                aria-live="polite">
            </div>

        </form>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 CHARUSAT University.
            All rights reserved.
        </p>

    </footer>


    <script src="registration.js"></script>

</body>

</html>
